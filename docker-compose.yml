services:
  orders-service:
    build: ./orders-service
    ports:
      - "8080:8080"

  products-service:
    build: ./products-service
    ports:
      - "8081:8081"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      ORDERS_URL: http://orders-service:8080
      PRODUCTS_URL: http://products-service:8081
    depends_on:
      - orders-service
      - products-service

  # ---- Monitoring (local demo) ----
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - orders-service
      - products-service

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      # Local demo credentials only - change them for anything shared
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/omnishop.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Small synthetic traffic generator so the dashboards have data to show
  loadgen:
    image: curlimages/curl:8.10.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -s -o /dev/null http://frontend/api/orders
          curl -s -o /dev/null http://frontend/api/products
          curl -s -o /dev/null http://frontend/svc/orders
          curl -s -o /dev/null http://orders-service:8080/not-found
          sleep 1
        done
    depends_on:
      - frontend
