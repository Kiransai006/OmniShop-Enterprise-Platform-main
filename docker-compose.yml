services:
  orders-service:
    build: ./orders-service
    ports:
      - "8080:8080"

  products-service:
    build: ./products-service
    ports:
      - "8081:8081"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      ORDERS_URL: http://orders-service:8080
      PRODUCTS_URL: http://products-service:8081
    depends_on:
      - orders-service
      - products-service
